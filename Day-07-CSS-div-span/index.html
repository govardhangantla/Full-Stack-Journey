<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Div and Span Demonstration</title>
  <!-- This line connects your HTML to your separate CSS file -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- The block-level container -->
  <div class="product-card">
    <h3>Awesome T-Shirt</h3>
    <p>A comfortable and stylish t-shirt made from <span class="highlight">100% cotton</span>.</p>
    
    <!-- The inline elements sitting side-by-side -->
    <span class="price">$25.00</span>
    <span class="stock-status">In Stock</span>
  </div>

</body>
</html>
