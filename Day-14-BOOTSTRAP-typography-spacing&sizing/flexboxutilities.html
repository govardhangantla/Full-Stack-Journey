<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Flexbox</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<div class="container py-5">

    <h1 class="text-center mb-5">
        Bootstrap Flexbox
    </h1>

    <!-- Row -->
    <h3>Flex Row</h3>

    <div class="d-flex flex-row gap-3 mb-5">
        <div class="p-3 border">HTML</div>
        <div class="p-3 border">CSS</div>
        <div class="p-3 border">JavaScript</div>
    </div>


    <!-- Column -->
    <h3>Flex Column</h3>

    <div class="d-flex flex-column gap-3 mb-5">
        <div class="p-3 border">HTML</div>
        <div class="p-3 border">CSS</div>
        <div class="p-3 border">JavaScript</div>
    </div>


    <!-- Center -->
    <h3>Center</h3>

    <div class="d-flex justify-content-center mb-5">
        <button class="btn btn-primary">
            Center Button
        </button>
    </div>


    <!-- Between -->
    <h3>Space Between</h3>

    <div class="d-flex justify-content-between mb-5">
        <button class="btn btn-primary">Left</button>
        <button class="btn btn-success">Middle</button>
        <button class="btn btn-danger">Right</button>
    </div>


    <!-- Wrap -->
    <h3>Flex Wrap</h3>

    <div class="d-flex flex-wrap gap-3">

        <div class="p-4 border">
            Box 1
        </div>

        <div class="p-4 border">
            Box 2
        </div>

        <div class="p-4 border">
            Box 3
        </div>

        <div class="p-4 border">
            Box 4
        </div>

        <div class="p-4 border">
            Box 5
        </div>

    </div>

</div>

</body>
</html>
