<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Utilities</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container py-5">

    <h1 class="text-center mb-5">
        Bootstrap Utilities
    </h1>


    <!-- Background -->
    <h3>Background Colors</h3>

    <div class="bg-primary text-white p-3 mb-3">
        Primary
    </div>

    <div class="bg-success text-white p-3 mb-3">
        Success
    </div>

    <div class="bg-warning p-3 mb-5">
        Warning
    </div>


    <!-- Text Colors -->
    <h3>Text Colors</h3>

    <p class="text-primary">
        Primary Text
    </p>

    <p class="text-success">
        Success Text
    </p>

    <p class="text-danger mb-5">
        Danger Text
    </p>


    <!-- Border -->
    <h3>Border</h3>

    <div class="border border-primary rounded p-4 mb-5">
        Bootstrap Border
    </div>


    <!-- Shadow -->
    <h3>Shadow</h3>

    <div class="shadow p-4 mb-5">
        Box with Shadow
    </div>


    <!-- Display -->
    <h3>Display</h3>

    <div class="d-flex gap-3 mb-5">

        <div class="border p-3">
            Box 1
        </div>

        <div class="border p-3">
            Box 2
        </div>

        <div class="border p-3">
            Box 3
        </div>

    </div>


    <!-- Opacity -->
    <h3>Opacity</h3>

    <div class="bg-primary text-white p-4 opacity-50 mb-5">
        50% Opacity
    </div>


    <!-- Position -->
    <h3>Position</h3>

    <div class="position-relative border p-5">

        Parent Box

        <div class="position-absolute top-0 end-0">
            ⭐
        </div>

    </div>

</div>

</body>
</html>
