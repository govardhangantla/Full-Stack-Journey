<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <div class="container mt-5">

        <h1 class="text-center mb-4">
            Registration Form
        </h1>


        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-6">

                <form>


                    <!-- Name -->

                    <div class="mb-3">

                        <label class="form-label">
                            Name
                        </label>

                        <input type="text"
                               class="form-control"
                               placeholder="Enter your name">

                    </div>


                    <!-- Email -->

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email"
                               class="form-control"
                               placeholder="Enter your email">

                    </div>


                    <!-- Password -->

                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input type="password"
                               class="form-control"
                               placeholder="Enter your password">

                    </div>


                    <!-- Course -->

                    <div class="mb-3">

                        <label class="form-label">
                            Select Course
                        </label>

                        <select class="form-select">

                            <option selected>
                                Choose a course
                            </option>

                            <option>
                                Java
                            </option>

                            <option>
                                Python
                            </option>

                            <option>
                                Full Stack Development
                            </option>

                        </select>

                    </div>


                    <!-- Message -->

                    <div class="mb-3">

                        <label class="form-label">
                            Message
                        </label>

                        <textarea class="form-control"
                                  rows="4"
                                  placeholder="Enter your message">
                        </textarea>

                    </div>


                    <!-- Checkbox -->

                    <div class="form-check mb-3">

                        <input class="form-check-input"
                               type="checkbox"
                               id="terms">

                        <label class="form-check-label"
                               for="terms">

                            I agree to the terms

                        </label>

                    </div>


                    <!-- Submit Button -->

                    <button type="submit"
                            class="btn btn-primary">

                        Submit

                    </button>


                    <!-- Reset Button -->

                    <button type="reset"
                            class="btn btn-secondary">

                        Reset

                    </button>


                </form>

            </div>

        </div>

    </div>

</body>

</html>
