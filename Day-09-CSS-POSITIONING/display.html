<!DOCTYPE html>
<html>
<head>
    <title>CSS Display Property</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CSS Display Property</h1>

    <!-- 1. Block -->
    <section>
        <h2>1. Block</h2>

        <div class="block-box">Block Box 1</div>
        <div class="block-box">Block Box 2</div>
    </section>


    <!-- 2. Inline -->
    <section>
        <h2>2. Inline</h2>

        <span class="inline-box">Inline 1</span>
        <span class="inline-box">Inline 2</span>
        <span class="inline-box">Inline 3</span>
    </section>


    <!-- 3. Inline-block -->
    <section>
        <h2>3. Inline-Block</h2>

        <div class="inline-block-box">Box 1</div>
        <div class="inline-block-box">Box 2</div>
        <div class="inline-block-box">Box 3</div>
    </section>


    <!-- 4. Flex -->
    <section>
        <h2>4. Flex</h2>

        <div class="flex-container">
            <div>Flex 1</div>
            <div>Flex 2</div>
            <div>Flex 3</div>
        </div>
    </section>


    <!-- 5. Grid -->
    <section>
        <h2>5. Grid</h2>

        <div class="grid-container">
            <div>Grid 1</div>
            <div>Grid 2</div>
            <div>Grid 3</div>
            <div>Grid 4</div>
            <div>Grid 5</div>
            <div>Grid 6</div>
        </div>
    </section>

</body>
</html>
